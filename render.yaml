services:
  - type: web
    name: memory-care-trainer
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3001"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_PASSWORD
        value: "admin123456"
      - key: DB_PATH
        value: "/app/data/memory.db"
